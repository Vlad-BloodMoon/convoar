name: Convoar Windows - ZIP de test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/convoar-windows-zip.yml'
      - 'dist/**'
      - 'docs/WINDOWS_WEB3D.*.md'
      - 'README.md'

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Verifier que Convoar est disponible
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/convoar.exe")) { throw "dist/convoar.exe introuvable" }
          if (-not (Test-Path "dist/OpenMetaverse.dll")) { throw "DLL OpenMetaverse introuvable" }
          Write-Host "Executable et dependances principales presents."

      - name: Tester Convoar sur Windows
        shell: pwsh
        run: |
          Push-Location dist
          try {
            & .\convoar.exe --help
            if ($LASTEXITCODE -ne 0) { throw "Convoar --help a retourne le code $LASTEXITCODE" }
          } finally { Pop-Location }

      - name: Fabriquer l'archive complete
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "package/Convoar" | Out-Null
          Copy-Item "dist/*" "package/Convoar/" -Recurse -Force
          @'
          Convoar Windows pour Web_3d
          =========================

          Distribution Windows de Convoar, preparee et testee par GitHub Actions.
          Verification sous Windows : convoar.exe --help.

          Conserver l'ensemble du dossier Convoar avec ses DLL.
          PowerShell, dans le dossier Convoar :
            .\convoar.exe --help

          Guides :
            https://github.com/Vlad-BloodMoon/convoar/blob/master/docs/WINDOWS_WEB3D.fr.md
            https://github.com/Vlad-BloodMoon/convoar/blob/master/docs/WINDOWS_WEB3D.en.md

          Python est necessaire pour oar2glb.py de Web_3d, pas pour Convoar.
          '@ | Set-Content "package/LISEZ-MOI.txt" -Encoding UTF8
          Compress-Archive -Path "package/*" -DestinationPath "Convoar-Windows-Web3D.zip" -Force
          Get-FileHash "Convoar-Windows-Web3D.zip" -Algorithm SHA256 | Format-List

      - name: Publier le ZIP dans les artefacts GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Convoar-Windows-Web3D
          path: Convoar-Windows-Web3D.zip
          if-no-files-found: error
          retention-days: 30

      - name: Creer une Release publique stable
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "web3d-windows-2026.11.10"
          @'
          ## Français
          Paquet Convoar pour Windows (fichiers .exe et DLL du dossier dist/).
          Le workflow a teste son demarrage sous Windows avec `convoar.exe --help`.
          Distribution Windows preparee et testee par GitHub Actions.
          Pour produire un GLB depuis un OAR, utiliser `oar2glb.py` du projet Web_3d.
          Prerequis : Windows avec .NET Framework 4.8 ; Python 3.9+ pour Web_3d.
          [Guide francais complet](https://github.com/Vlad-BloodMoon/convoar/blob/master/docs/WINDOWS_WEB3D.fr.md).

          ## English
          Ready-to-use Windows bundle containing Convoar and its dependencies.
          The workflow validates startup with `convoar.exe --help` on Windows.
          Windows distribution prepared and tested by GitHub Actions.
          Use Web_3d's `oar2glb.py` to convert an OpenSimulator OAR into GLB.
          Requirements: Windows/.NET Framework 4.8; Python 3.9+ for Web_3d.
          [Complete English guide](https://github.com/Vlad-BloodMoon/convoar/blob/master/docs/WINDOWS_WEB3D.en.md).
          '@ | Set-Content release-notes.md -Encoding UTF8
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --notes-file release-notes.md
          } else {
            gh release create $tag "Convoar-Windows-Web3D.zip" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Convoar Windows for Web_3d (2026-11)" --notes-file release-notes.md
          }
